<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clima Perú</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

  <header class="container text-center my-4">
    <h1>CLIMA PERÚ</h1>
    <p>Aquí veremos el clima de nuestro país.</p>
  </header>

  <main class="container">
    <section class="buscador">
      <select id="selectorCiudad" class="form-select"> 
        <option value="lima">Lima</option>
        <option value="cusco">Cusco</option>
        <option value="arequipa">Arequipa</option>
        <option value="trujillo">Trujillo</option>
        <option value="piura">Piura</option>
        <option value="iquitos">Iquitos</option>
        <option value="puno">Puno</option>
        <option value="huancayo">Huancayo</option>
      </select>

      <button id="btnConsultar" class="btn btn-dark w-100 mt-3">VER CLIMA</button>   
    </section>

    <p id="mensajeError" class="text-danger mt-3"></p>
                          
    <section id="resultado" class="card p-3 my-5"></section>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2026 Sofia Tarrillo. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script src="appcomplemento.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
